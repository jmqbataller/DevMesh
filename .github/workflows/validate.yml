name: Validate DevMesh

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("plugins/devmesh/.codex-plugin/plugin.json"))["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=dist/devmesh-chatgpt-v$VERSION.zip" >> "$GITHUB_OUTPUT"
      - name: Validate plugin and feature contracts
        run: |
          python tests/validate_devmesh.py
          python tests/test_routing_contract.py
          python tests/test_feature_contracts.py
          python tests/test_chatgpt_adapter.py
          python tests/test_plugin_submission_pack.py
      - name: Build ChatGPT distribution bundle
        run: python scripts/build_chatgpt_adapter.py --output "${{ steps.version.outputs.bundle }}"
      - name: Upload ChatGPT distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: devmesh-chatgpt-v${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.bundle }}
          if-no-files-found: error
      - name: Publish GitHub Release bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BUNDLE" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DevMesh $TAG" \
              --notes-file docs/plugin-submission/RELEASE_NOTES.md
          else
            gh release create "$TAG" "$BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DevMesh $TAG" \
              --notes-file docs/plugin-submission/RELEASE_NOTES.md
          fi
