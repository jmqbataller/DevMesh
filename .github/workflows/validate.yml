name: Validate DevMesh

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate plugin and feature contracts
        run: |
          python tests/validate_devmesh.py
          python tests/test_routing_contract.py
          python tests/test_feature_contracts.py
          python tests/test_chatgpt_adapter.py
